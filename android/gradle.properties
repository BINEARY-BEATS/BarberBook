# Keep Gradle lean — this machine has ~7GB RAM; -Xmx8G crashes the daemon.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
